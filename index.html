<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lotto Number Generator</title>
    <link rel="stylesheet" href="style.css?v=1.1">
</head>
<body>
    <div class="container">
        <h1>Lotto Number Generator</h1>
        <div class="generator">
            <div id="numbers" class="numbers"></div>
            <button id="generate" class="btn">Generate Numbers</button>
        </div>
        <div class="history">
            <h2>History</h2>
            <ul id="history-list"></ul>
        </div>
        <div class="contact">
            <h2>제휴 문의</h2>
            <form action="https://formspree.io/f/xaqzdpbq" method="POST">
                <div class="form-group">
                    <input type="text" name="name" placeholder="성함" required>
                </div>
                <div class="form-group">
                    <input type="email" name="email" placeholder="이메일" required>
                </div>
                <div class="form-group">
                    <textarea name="message" placeholder="문의 내용" required></textarea>
                </div>
                <button type="submit" class="btn">문의 보내기</button>
            </form>
        </div>
        <div class="comments">
            <h2>댓글</h2>
            <div id="disqus_thread"></div>
            <script>

                };

            <noscript>Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript">comments powered by Disqus.</a></noscript>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
